services:
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    networks:
      - datalake-network

  postgres:
    image: postgres:14
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    networks:
      - datalake-network

  hive-metastore:
    image: bitsudata/hive:3.1.2-metastore
    environment:
      SERVICE_NAME: metastore
      DB_TYPE: postgres
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-airflow}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
    depends_on:
      - postgres
    networks:
      - datalake-network

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark/apps:/opt/spark-apps
      - ./spark/jars:/opt/spark-jars
    environment:
      SPARK_MASTER_HOST: spark-master
    networks:
      - datalake-network

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./spark/apps:/opt/spark-apps
      - ./spark/jars:/opt/spark-jars
    environment:
      SPARK_MASTER: spark://spark-master:7077
    networks:
      - datalake-network

  trino:
    image: trinodb/trino:418
    ports:
      - "8090:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore
    networks:
      - datalake-network

  airflow:
    image: apache/airflow:2.6.3
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW_UID: 50000
      AIRFLOW_GID: 0
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}
    depends_on:
      - postgres
    networks:
      - datalake-network

  jupyter:
    image: jupyter/pyspark-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-jupyter123}
    networks:
      - datalake-network

  great_expectations:
    image: greatexpectations/great_expectations:0.18.9
    ports:
      - "4000:8000"
    volumes:
      - ./great_expectations:/usr/app/great_expectations
    depends_on:
      - spark-master
      - postgres
    networks:
      - datalake-network
    command: "python -m http.server 8000 -d /usr/app/great_expectations/uncommitted/data_docs/local_site"

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
  airflow_plugins:

networks:
  datalake-network:
    name: datalake-network
