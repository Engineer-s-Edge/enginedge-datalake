name: Release Management

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for'
        required: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.tag.outputs.tag }}^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
            CHANGES=$(git log ${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${{ steps.prev_tag.outputs.prev_tag }}..${{ steps.tag.outputs.tag }} --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          # Save to file for multiline handling
          cat > changelog.md << EOF
          ## What's Changed
          
          $CHANGES
          
          ## Components
          
          This release includes the following data lake components:
          - MinIO (Object Storage)
          - PostgreSQL (Metadata)
          - Apache Spark (Data Processing)
          - Trino (Query Engine)
          - Apache Airflow (Orchestration)
          - Jupyter Lab (Analytics)
          - Observability Service
          
          ## Docker Images
          
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          \`\`\`
          
          ## Deployment
          
          ### Kubernetes
          \`\`\`bash
          kubectl apply -k kubernetes/
          \`\`\`
          
          ### Docker Compose
          \`\`\`bash
          docker compose up -d
          \`\`\`
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ steps.tag.outputs.tag }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release artifacts
        run: |
          mkdir -p release-artifacts
          
          # Create deployment package
          tar -czf release-artifacts/datalake-${{ steps.tag.outputs.tag }}.tar.gz \
            docker-compose.yml \
            kubernetes/ \
            setup/ \
            README.md \
            docs/
          
          # Create checksum
          cd release-artifacts
          sha256sum datalake-${{ steps.tag.outputs.tag }}.tar.gz > checksums.txt

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Send notification
        run: |
          echo "Release created successfully"
          echo "Tag: ${{ needs.create-release.outputs.tag }}"
