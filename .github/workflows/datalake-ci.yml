name: datalake-ci

on:
  push:
    paths:
      - 'enginedge-datalake/**'
      - 'enginedge-datalake/.github/workflows/datalake-ci.yml'
  pull_request:
    paths:
      - 'enginedge-datalake/**'

jobs:
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose config
        working-directory: enginedge-datalake
        run: docker compose config
      - name: Build minimal images
        working-directory: enginedge-datalake
        run: |
          docker compose build --no-cache || true
