name: Dependency Updates

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  # Update npm dependencies
  update-npm:
    name: Update NPM Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for outdated packages
        id: outdated
        run: |
          npm outdated --json > outdated.json || true
          if [ -s outdated.json ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update dependencies
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npm update
          npm audit fix --audit-level=moderate || true

      - name: Run tests
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          npm ci
          npm run build

      - name: Create Pull Request
        if: steps.outdated.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update npm dependencies'
          title: 'chore: Update NPM dependencies'
          body: |
            ## Automated Dependency Update
            
            This PR updates NPM dependencies to their latest compatible versions.
            
            ### Changes
            - Updated dependencies based on semver compatibility
            - Ran `npm audit fix` to address security vulnerabilities
            
            ### Testing
            - ✅ Build passed
            - ⏳ Please review and run additional tests
            
            **Auto-generated by dependency update workflow**
          branch: chore/update-npm-dependencies
          base: dev
          labels: dependencies, automated

  # Update Python dependencies
  update-python:
    name: Update Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: |
          pip install pip-tools pip-audit

      - name: Check for security vulnerabilities
        id: audit
        run: |
          pip-audit -r requirements-test.txt --format json > audit-results.json || true
          if [ -s audit-results.json ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
          fi

      - name: Update requirements
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        run: |
          # Update packages with known vulnerabilities
          pip list --outdated --format json > outdated.json
          # This is a placeholder - actual update logic would be more sophisticated
          echo "Vulnerabilities found - manual review recommended"

      - name: Create Issue for Python updates
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const audit = JSON.parse(fs.readFileSync('audit-results.json', 'utf8'));
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Security vulnerabilities found in Python dependencies',
              body: `## Python Dependency Security Alert\n\nAutomated scan found security vulnerabilities in Python dependencies.\n\n\`\`\`json\n${JSON.stringify(audit, null, 2)}\n\`\`\`\n\nPlease review and update affected packages.`,
              labels: ['security', 'dependencies', 'python']
            });

  # Docker base image updates
  check-docker-images:
    name: Check Docker Image Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for base image updates
        run: |
          echo "Checking Docker base images..."
          docker pull node:20-alpine
          docker pull postgres:14
          docker pull minio/minio:latest
          echo "Base images checked"

      - name: Scan images for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image node:20-alpine --severity HIGH,CRITICAL

      - name: Create notification if updates needed
        run: |
          echo "Check Docker Hub for updates to base images"
