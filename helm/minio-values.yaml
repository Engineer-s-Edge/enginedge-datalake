# Helm values for MinIO deployment
# Uses the official MinIO Helm chart: https://github.com/minio/minio/tree/master/helm/minio

# MinIO mode - standalone is suitable for development
mode: standalone

# Root credentials
rootUser: minioadmin
rootPassword: minioadmin123

# Persistence configuration
persistence:
  enabled: true
  size: 10Gi

# Resource limits
resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

# Service configuration
service:
  type: ClusterIP
  port: 9000
  
consoleService:
  type: ClusterIP
  port: 9001

# Ingress - disabled by default, can be enabled for production
ingress:
  enabled: false

# Security context
securityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Network policies
networkPolicy:
  enabled: false

# Metrics - can be enabled for monitoring
metrics:
  serviceMonitor:
    enabled: false
