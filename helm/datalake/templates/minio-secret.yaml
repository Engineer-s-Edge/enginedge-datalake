{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datalake.fullname" . }}-minio-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "datalake.minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.minio.rootUser }}
  root-password: {{ .Values.minio.rootPassword }}
{{- end }}
