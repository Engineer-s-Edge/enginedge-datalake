{{- if .Values.hiveMetastore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "datalake.hive-metastore.labels" . | nindent 4 }}
    app: enginedge
    component: hive-metastore
spec:
  type: {{ .Values.hiveMetastore.service.type }}
  ports:
  - name: thrift
    port: {{ .Values.hiveMetastore.service.port }}
    targetPort: 9083
    protocol: TCP
  selector:
    {{- include "datalake.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hive-metastore
{{- end }}
