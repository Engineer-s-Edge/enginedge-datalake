{{- if .Values.airflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "datalake.airflow.labels" . | nindent 4 }}
    app: enginedge
    component: airflow
spec:
  type: {{ .Values.airflow.service.type }}
  ports:
  - name: web
    port: {{ .Values.airflow.service.port }}
    targetPort: 8080
    protocol: TCP
  selector:
    {{- include "datalake.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: airflow
{{- end }}
