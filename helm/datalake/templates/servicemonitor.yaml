{{- if and .Values.serviceMonitor.enabled .Values.trino.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "datalake.fullname" . }}-trino
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "datalake.trino.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "datalake.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: trino
  endpoints:
  - port: http
    path: {{ .Values.trino.metrics.path }}
    interval: {{ .Values.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
