{{- if and .Values.postgres.enabled .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "datalake.fullname" . }}-postgres-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "datalake.postgres.labels" . | nindent 4 }}
    component: postgres
    tier: database
    persistence: enabled
  annotations:
    {{- if .Values.postgres.persistence.storageClass }}
    volume.beta.kubernetes.io/storage-class: {{ .Values.postgres.persistence.storageClass | quote }}
    {{- end }}
    description: "Persistent storage for PostgreSQL database - stores Airflow metadata and Hive Metastore data"
    backup-policy: {{ .Values.postgres.persistence.backupPolicy | default "daily" | quote }}
    {{- with .Values.postgres.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.postgres.persistence.accessModes | nindent 4 }}
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
  {{- if .Values.postgres.persistence.selector }}
  selector:
    {{- toYaml .Values.postgres.persistence.selector | nindent 4 }}
  {{- end }}
{{- end }}
