---
# Airflow DAGs PVC (if using persistent DAGs)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags-pvc
  namespace: datalake
  labels:
    app: enginedge
    component: airflow
    tier: orchestration
    persistence: enabled
  annotations:
    volume.beta.kubernetes.io/storage-class: "datalake-standard"
    description: "Persistent storage for Airflow DAGs"
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods may need to read DAGs
  storageClassName: datalake-shared  # Use shared storage for RWX access
  resources:
    requests:
      storage: 5Gi
