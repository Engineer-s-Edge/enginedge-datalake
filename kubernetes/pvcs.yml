# Datalake Persistent Volume Claims
# These PVCs provide persistent storage for PostgreSQL and MinIO
# Adjust storageClassName based on your environment

---
# PostgreSQL Primary Database PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: datalake
  labels:
    app: enginedge
    component: postgres
    tier: database
    persistence: enabled
  annotations:
    volume.beta.kubernetes.io/storage-class: "datalake-fast"
    description: "Persistent storage for PostgreSQL database - stores Airflow metadata and Hive Metastore data"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: datalake-fast  # Use fast storage for database performance
  resources:
    requests:
      storage: 10Gi
  # Optional: Use selector to bind to pre-created PVs
  # selector:
  #   matchLabels:
  #     app: postgres

---
# MinIO Object Storage PVC (Primary)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: datalake
  labels:
    app: enginedge
    component: minio
    tier: storage
    persistence: enabled
    bucket-type: primary
  annotations:
    volume.beta.kubernetes.io/storage-class: "datalake-bulk"
    description: "Primary storage for MinIO object storage - general purpose buckets"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: datalake-bulk  # Use bulk storage for cost-effective object storage
  resources:
    requests:
      storage: 50Gi
  # Optional: Use selector to bind to pre-created PVs
  # selector:
  #   matchLabels:
  #     app: minio
  #     bucket-type: primary

---
# MinIO Lakehouse/Data Lake PVC (for large analytical datasets)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-lakehouse-pvc
  namespace: datalake
  labels:
    app: enginedge
    component: minio
    tier: storage
    persistence: enabled
    bucket-type: lakehouse
  annotations:
    volume.beta.kubernetes.io/storage-class: "datalake-bulk"
    description: "Lakehouse storage for MinIO - dedicated for large analytical datasets and data lake tables"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: datalake-bulk
  resources:
    requests:
      storage: 100Gi

